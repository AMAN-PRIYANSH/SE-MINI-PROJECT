[flake8]
max-line-length = 120
exclude = .git,__pycache__,.venv,venv,data_store,build
per-file-ignores =
    tests/report/make_report.py:E501

[tool:pytest]
testpaths = tests
addopts = -ra
markers =
    perf: performance measurements (STP 5.3)
    ui: browser tests (Playwright)
    slow: slow tests
